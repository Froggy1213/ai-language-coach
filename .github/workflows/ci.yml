name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests & code style
    runs-on: ubuntu-latest

    # The suite runs against MySQL, never SQLite (see backend/phpunit.xml).
    # Database name and credentials mirror phpunit.xml on purpose, so CI and a
    # local run exercise the same configuration instead of two similar ones.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: language_coach_testing
          MYSQL_USER: coach_user
          MYSQL_PASSWORD: coach_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

      # Resolving the subscription storage manager opens a Redis connection, so
      # the suite needs a server even though no test issues a Redis command.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, bcmath, redis
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        env:
          # Load-bearing, exactly as in backend/Dockerfile: `composer install`
          # runs the post-autoload-dump hook (`artisan package:discover`), which
          # boots AppServiceProvider and therefore ProductionSanityCheck. The
          # .env is created by the *next* step, so at this point Laravel falls
          # back to its default APP_ENV of `production`, the guard refuses the
          # development defaults, and the job dies in "Install dependencies"
          # before anything is installed. This is why CI was red from d37959d9
          # onwards while every local run stayed green: a developer has a .env.
          APP_ENV: local
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml supplies the DB_* values; this step only provides the app
      # key the framework needs in order to boot.
      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests
        working-directory: backend
        run: php artisan test --compact

      - name: Check code style
        working-directory: backend
        run: vendor/bin/pint --test

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    env:
      NUXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `legacy-peer-deps` is set in frontend/.npmrc — required for the install
      # to resolve at all, so it must not be passed as a one-off flag here.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Regenerate GraphQL types and verify the committed file is not stale.
      # The diff check is what keeps the generated file honest.
      - name: Verify generated GraphQL types
        working-directory: frontend
        run: |
          npm run codegen
          git diff --exit-code -- app/types/graphql.ts

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  agent:
    name: Agent — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run tests
        working-directory: agent
        # Discovery rather than one named file: the suite grew past
        # test_turn_metrics.py (the Sentry scrubber, the worker-pool settings, the
        # dialogue-model and turn-handling decisions, and the SDK integration tests
        # that build a real AgentSession from them) and a hard-coded filename
        # silently stops covering the tests added beside it. 99 tests here; a host
        # run without livekit-agents skips the 16 that need it, and this job
        # installs it from requirements.txt.
        run: python -m unittest discover -s . -p "test_*.py"

  containers:
    # The three jobs above run against a *source checkout*, so none of them can
    # see a defect that only exists inside an image: a build-context exclusion
    # that removed a file the runtime needs, an `artisan` call that fails because
    # the image has no .env, a Nitro server bound to the wrong host. This job
    # exists because exactly that happened — `composer dump-autoload` booted
    # AppServiceProvider with Laravel's default APP_ENV of `production`, the
    # production sanity check refused the development defaults, and the API image
    # stopped building while every other job stayed green. See decision 57.
    #
    # `backend/Dockerfile` is what ECS deploys for four services (api, horizon,
    # reverb, migrations), so a failure here is a failed deployment.
    name: Containers — build and boot the images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke the images
        run: ./scripts/verify-images.sh

      - name: Dump the failing container's log
        if: failure()
        run: |
          for name in coach_verify_api coach_verify_web; do
            echo "--- $name"
            docker logs "$name" 2>&1 | tail -50 || true
          done
