name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests & code style
    runs-on: ubuntu-latest

    # The suite runs against MySQL, never SQLite (see backend/phpunit.xml).
    # Database name and credentials mirror phpunit.xml on purpose, so CI and a
    # local run exercise the same configuration instead of two similar ones.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: language_coach_testing
          MYSQL_USER: coach_user
          MYSQL_PASSWORD: coach_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, bcmath
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml supplies the DB_* values; this step only provides the app
      # key the framework needs in order to boot.
      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests
        working-directory: backend
        run: php artisan test --compact

      - name: Check code style
        working-directory: backend
        run: vendor/bin/pint --test

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    env:
      NUXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `legacy-peer-deps` is set in frontend/.npmrc — required for the install
      # to resolve at all, so it must not be passed as a one-off flag here.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
