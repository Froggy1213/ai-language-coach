; PHP settings baked into the immutable production image. Applies to every SAPI
; (php-fpm and the CLI used by Horizon / artisan), so only SAPI-neutral values
; belong here — the web-specific overrides live in php-fpm-pool.conf.

expose_php = Off
date.timezone = UTC

; Ceiling, not an allocation. The CLI keeps a generous limit for Horizon jobs
; (LLM calls, transcript processing); php-fpm workers are capped lower, to 256M,
; by php-fpm-pool.conf.
memory_limit = 512M

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable and deployments replace containers, so opcache never
; needs to stat files for changes. Requires a restart to pick up new code.
opcache.validate_timestamps = 0
opcache.save_comments = 1
; Left off: Laravel gains little from JIT and it complicates profiling.
opcache.jit = disable

realpath_cache_size = 4096k
realpath_cache_ttl = 600
