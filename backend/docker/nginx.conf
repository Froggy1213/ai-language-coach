# nginx front end for the Laravel API. Replaces the stock /etc/nginx/nginx.conf so
# there are no /etc/nginx/http.d/*.conf includes to reason about.
#
# Everything logs to stdout/stderr; the container has no log files to collect.
# php-fpm listens on 127.0.0.1:9000 (see php-fpm-pool.conf).

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Audio for the assessment flow goes to S3 via presigned URLs and never
    # passes through Laravel, so this is headroom rather than a requirement.
    client_max_body_size 20m;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain;

    client_body_temp_path  /var/lib/nginx/tmp/client_body;
    proxy_temp_path        /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path      /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path        /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path         /var/lib/nginx/tmp/scgi;

    server {
        listen       8080;
        server_name  _;

        root   /var/www/html/public;
        index  index.php;

        # Laravel's health endpoint: the ALB target group checks it every few
        # seconds, so keep it out of the access log.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_read_timeout 60s;

            # Spelled out instead of including fastcgi.conf so the file does not
            # depend on which nginx package variant ships it.
            fastcgi_param  SCRIPT_FILENAME   $realpath_root$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT     $realpath_root;
            fastcgi_param  QUERY_STRING      $query_string;
            fastcgi_param  REQUEST_METHOD    $request_method;
            fastcgi_param  CONTENT_TYPE      $content_type;
            fastcgi_param  CONTENT_LENGTH    $content_length;
            fastcgi_param  SCRIPT_NAME       $fastcgi_script_name;
            fastcgi_param  REQUEST_URI       $request_uri;
            fastcgi_param  DOCUMENT_URI      $document_uri;
            fastcgi_param  SERVER_PROTOCOL   $server_protocol;
            fastcgi_param  REQUEST_SCHEME    $scheme;
            fastcgi_param  HTTPS             $https if_not_empty;
            fastcgi_param  GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param  SERVER_SOFTWARE   nginx/$nginx_version;
            fastcgi_param  REMOTE_ADDR       $remote_addr;
            fastcgi_param  REMOTE_PORT       $remote_port;
            fastcgi_param  SERVER_ADDR       $server_addr;
            fastcgi_param  SERVER_PORT       $server_port;
            fastcgi_param  SERVER_NAME       $server_name;
            fastcgi_param  REDIRECT_STATUS   200;
        }

        # Block dotfiles, but keep ACME challenges working.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
