; Overrides for the default `www` pool. Files in /usr/local/etc/php-fpm.d are
; included in alphabetical order, so this one (zz-app.conf) is applied after the
; image's own www.conf and docker.conf.
;
; Already handled by the image and therefore NOT repeated here:
;   listen = 9000, clear_env = no (env vars reach PHP), catch_workers_output = yes,
;   decorate_workers_output = no, error/access log -> /proc/self/fd/2.

[www]
pm = dynamic

; Tune to the Fargate task size: each child may reach the 256M ceiling set below,
; so max_children x 256M is the worst case. Web requests here are short GraphQL
; calls, not uploads.
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycle workers periodically to bound the effect of any leak.
pm.max_requests = 500

; Web requests are small; Horizon workers and one-off artisan commands keep the
; higher CLI ceiling from zz-prod.ini.
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[post_max_size] = 20M
php_admin_value[upload_max_filesize] = 20M
php_admin_flag[log_errors] = on
