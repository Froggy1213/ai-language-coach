; Runs php-fpm and nginx as the container's main processes.
;
; Both write to stdout/stderr, which is where CloudWatch reads them. supervisord
; is PID 1, so it receives the SIGTERM that ECS sends on task shutdown and stops
; the children in reverse priority order.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
; The image's zz-docker.conf already sets daemonize=no; -F makes it explicit.
command=/usr/local/sbin/php-fpm -F
priority=5
autostart=true
autorestart=true
startsecs=1
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
