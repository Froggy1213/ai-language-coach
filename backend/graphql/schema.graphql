# Root schema. Object types live in `types/`, one file per aggregate;
# native PHP enums are registered on the TypeRegistry (AppServiceProvider)
# and are referenced here without being declared.

#import types/*.graphql

"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    "The currently authenticated user."
    me: User! @guard @auth

    "The roadmap the authenticated user is working through, if one has been generated yet."
    roadmap: Roadmap @guard @field(resolver: "App\\GraphQL\\Queries\\Roadmap")

    "Review items whose review date has arrived, soonest first."
    dueReviews: [ReviewItem!]! @guard @whereAuth(relation: "user") @all(scopes: ["due"])

    "The authenticated user's mistakes, newest first."
    mistakes(
        "Restrict the result to a single grammar point."
        grammarPointId: ID
    ): [Mistake!]! @guard @field(resolver: "App\\GraphQL\\Queries\\Mistakes")

    "A voice session belonging to the authenticated user, if it exists."
    voiceSession(
        "Primary key of the voice session."
        id: ID!
    ): VoiceSession @guard @field(resolver: "App\\GraphQL\\Queries\\VoiceSession")

    "Grammar points the learner got wrong in at least N distinct sessions within the rolling window."
    recurringMistakes: [RecurringMistake!]! @guard @field(resolver: "App\\GraphQL\\Queries\\RecurringMistakes")
}


type Mutation {
    "Sign in and start a session (Sanctum SPA cookie)."
    login(email: String!, password: String!): User!
        @throttle(maxAttempts: 10, decayMinutes: 1)
        @field(resolver: "App\\GraphQL\\Mutations\\Login")
        @validator(class: "App\\GraphQL\\Validators\\LoginValidator")

    "Create an account and sign in."
    register(name: String!, email: String!, password: String!, targetLanguage: String!): User!
        @throttle(maxAttempts: 5, decayMinutes: 1)
        @field(resolver: "App\\GraphQL\\Mutations\\Register")
        @validator(class: "App\\GraphQL\\Validators\\RegisterValidator")

    "End the current session."
    logout: Boolean! @guard @field(resolver: "App\\GraphQL\\Mutations\\Logout")

    """
    Build the roadmap for the authenticated user's current CEFR band, or return
    the one they already have. Idempotent, so a retry after a timeout is safe.
    """
    generateRoadmap: Roadmap! @guard @field(resolver: "App\\GraphQL\\Mutations\\GenerateRoadmap")

    """
    Presign one S3 POST for an onboarding recording. The signature carries the
    size and content-type limits, so the bucket rejects a bad upload itself.
    """
    createAssessmentUploadUrl(
        "What the browser will send, e.g. `audio/webm;codecs=opus`."
        contentType: String!
    ): PresignedUpload!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\CreateAssessmentUploadUrl")
        @validator(class: "App\\GraphQL\\Validators\\CreateAssessmentUploadUrlValidator")

    """
    Hand an uploaded recording to the transcription and CEFR analysis job. The
    answer arrives through the `assessmentReady` subscription.
    """
    submitAssessment(
        "`fileUrl` returned by `createAssessmentUploadUrl`, once the upload finished."
        audioUrl: String!
    ): Assessment!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\SubmitAssessment")
        @validator(class: "App\\GraphQL\\Validators\\SubmitAssessmentValidator")

    """
    Open a spoken practice session for a lesson card and return the room and its
    access token. Idempotent: while a session is pending or active, calling this
    again returns that same session instead of opening a second room. Fails with
    the `VOICE_FLEET_BUSY` error code when no agent worker is free.
    """
    requestVoiceToken(
        "The lesson card to practise; must be one of the learner's own `ready` cards."
        lessonCardId: ID!
    ): VoiceSession! @guard @field(resolver: "App\\Voice\\StartVoiceSession")

    """
    Submit the learner's self-assessed recall quality (0 to 5) for a grammar point
    and recompute its spaced repetition schedule using the SM-2 algorithm.
    """
    submitReviewResult(
        "The grammar point that was reviewed."
        grammarPointId: ID!
        "Recall quality score from 0 (complete blackout) to 5 (perfect recall)."
        quality: Int!
    ): ReviewItem!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\SubmitReviewResult")
        @validator(class: "App\\GraphQL\\Validators\\SubmitReviewResultValidator")

    """
    Mark a lesson card as completed and unlock the next card in sequence (order_index + 1)
    inside a database transaction under pessimistic locking. Idempotent: repeating on
    an already completed card leaves it completed and returns it.
    """
    completeLessonCard(
        "The lesson card to complete; must be one of the learner's own cards."
        lessonCardId: ID!
    ): LessonCard!
        @guard
        @field(resolver: "App\\GraphQL\\Mutations\\CompleteLessonCard")
        @validator(class: "App\\GraphQL\\Validators\\CompleteLessonCardValidator")
}

type Subscription {
    """
    Fires when the learner's assessment finished. Nullable on purpose: at
    subscribe time the field resolves to null, and a non-null type would reject
    the subscription response (plan §5).
    """
    assessmentReady(
        "Whose assessment to watch; must be the authenticated user."
        userId: ID!
    ): Assessment
        @guard
        @subscription(class: "App\\GraphQL\\Subscriptions\\AssessmentReady")

    """
    Fires when a voice session's feedback and mistake analysis is ready.
    Nullable on purpose: at subscribe time the field resolves to null, and
    a non-null type would reject the subscription response (plan §5).
    """
    sessionFeedbackReady(
        "The voice session to watch; must belong to the authenticated user."
        sessionId: ID!
    ): VoiceSession
        @guard
        @subscription(class: "App\\GraphQL\\Subscriptions\\SessionFeedbackReady")
}

