"Spaced repetition state for one (user, grammar point) pair (plan §5)."
type ReviewItem {
    "Unique primary key."
    id: ID!

    "Grammar point to review."
    grammarPoint: GrammarPoint! @belongsTo

    "SM-2 ease factor."
    easeFactor: Float! @rename(attribute: "ease_factor")

    "Current interval between repetitions, in days."
    intervalDays: Int! @rename(attribute: "interval_days")

    "Number of consecutive successful reviews."
    repetitionNumber: Int! @rename(attribute: "repetition_number")

    "When the item is due next."
    nextReviewAt: String! @rename(attribute: "next_review_at")

    """
    The newest mistake behind this item: the learner's own sentence, its
    correction and the explanation, used as the recall prompt. Null when the
    mistake history is gone.
    """
    latestMistake: Mistake @field(resolver: "App\\GraphQL\\Resolvers\\ReviewItemLatestMistake")
}
