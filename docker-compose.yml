# Infrastructure and services configuration.
#
# By default, stateful backing services + LiveKit + Voice Agent run in Docker:
#   `docker compose up -d`
# Laravel and Nuxt run natively on the host (php artisan serve / npm run dev) so HMR,
# xdebug, and artisan stay fast — see README.md -> "Local setup".
#
# Alternatively, to run the ENTIRE stack (including Laravel, Reverb, Horizon, and Nuxt)
# in containers without running anything on the host:
#   `docker compose --profile full up -d`
#
# Every value below can be overridden from `.env` in this directory (copy
# `.env.example` to `.env`); each one has a default, so `docker compose up -d`
# works without any .env at all.
#
# The compose project name is intentionally NOT set: it must stay derived from
# this directory, otherwise the existing `ai_language_coach_*` volumes (your
# current database) would be replaced by empty ones.

# ---------------------------------------------------------------------------
# The LiveKit key pair signs access tokens *and* webhooks, so the server, the
# agent and the backend have to sign with the same one. Defined once because a
# mismatch between any two of them is indistinguishable from a wrong
# VOICE_AGENT_NAME: rooms open, dispatches are accepted, nobody ever joins.
# ---------------------------------------------------------------------------
x-livekit-credentials: &livekit-credentials
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-99fed3cd67e98cae5fa57a9aec3818d317f5e8a54f67c87e}

# ---------------------------------------------------------------------------
# Shared Laravel environment for the `full` profile (api, horizon, reverb).
#
# `backend/.env` is excluded from the image on purpose (backend/.dockerignore),
# so every key the application needs has to arrive as an environment variable —
# a role that is missing one still boots and only fails at the first query.
# One anchor instead of three copies is what keeps the three roles from drifting
# apart. The database and object-store values interpolate the same variables the
# `mysql` and `minio` services use, so a container cannot be pointed at a
# database or bucket that was never created.
#
# The queue is Redis here rather than the `database` driver backend/.env uses:
# Horizon only consumes Redis queues, so a `database` queue would leave the
# horizon container running and permanently idle.
# ---------------------------------------------------------------------------
x-laravel-environment: &laravel-environment
  <<: *livekit-credentials

  APP_ENV: local
  APP_DEBUG: "true"

  # A local-development key ONLY. Committed so this profile works with no .env
  # at all, but every service sharing it can read every other service's cookies
  # and tokens — which is exactly what production must not do, and why plan §7
  # takes the real key from Secrets Manager.
  APP_KEY: ${APP_KEY:-base64:/z0ptXSDQvAl3H0G0+Yn+HjGr+x+kaKcXBkzrEv2iZE=}

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-language_coach}
  DB_USERNAME: ${MYSQL_USER:-coach_user}
  DB_PASSWORD: ${MYSQL_PASSWORD:-coach_password}

  REDIS_HOST: redis
  REDIS_PORT: 6379

  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb

  # The three Lighthouse subscription keys backend/.env supplies on the host and
  # the image cannot, because backend/.env is excluded from it. Each one is a
  # silent failure without the other two looking wrong: without the broadcaster
  # Lighthouse falls back to `pusher`, whose key is unset, so channel
  # authorization answers 500 and the browser's subscription never confirms;
  # without `redis` the subscription registry lands in the same cache store the
  # app uses; and with the default query-cache mode the parsed AST is serialised
  # into that store and comes back as `__PHP_Incomplete_Class`
  # (`cache.serializable_classes => false`), so every repeated query 500s.
  LIGHTHOUSE_BROADCASTER: reverb
  LIGHTHOUSE_SUBSCRIPTION_STORAGE: redis
  LIGHTHOUSE_QUERY_CACHE_MODE: opcache

  # Reverb's host and port here are the *server-side* target: inside the network
  # the service is `reverb:8081`. The browser is told a different address by the
  # `web` service below, for the same reason LIVEKIT_PUBLIC_URL exists.
  REVERB_APP_ID: ${REVERB_APP_ID:-}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
  REVERB_HOST: reverb
  REVERB_PORT: 8081
  REVERB_SCHEME: http

  # Sanctum only hands out stateful (cookie) auth to the hosts listed here, and
  # backend/.env is excluded from the image, so the `full` profile has to name
  # the browser's origin itself — without this the SPA at 127.0.0.1:3000 cannot
  # sign in at all, while the same request from the host works.
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-127.0.0.1:3000,localhost:3000,127.0.0.1:8000}

  # Browser origins allowed to make credentialed requests; never '*'.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  AWS_ENDPOINT: http://minio:9000
  # The learner's browser posts the recording straight to the bucket, so it has
  # to be told an address it can resolve — `minio` is not one of them. Same
  # two-audience split as LIVEKIT_URL/LIVEKIT_PUBLIC_URL below, and the same
  # published port the `minio` service maps.
  AWS_PUBLIC_ENDPOINT: ${AWS_PUBLIC_ENDPOINT:-http://127.0.0.1:${MINIO_PORT:-9000}}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-coach_minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-coach_minio_password}
  AWS_BUCKET: ${AWS_BUCKET:-coach-audio}
  AWS_DEFAULT_REGION: us-east-1
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # LIVEKIT_URL is what this backend dials (Twirp); LIVEKIT_PUBLIC_URL is what
  # the learner's browser dials (WebRTC). A browser cannot resolve `livekit`, so
  # a containerised API has to set both or every session hands the learner a
  # hostname that does not exist.
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://127.0.0.1:7880}
  VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-ai-language-coach}
  VOICE_INTERNAL_SECRET: ${VOICE_INTERNAL_SECRET:-82cba8627ffb6407e152a3baa17f586b85f213cacb9b55b9}

  # Error tracking and the metrics sink (plan §1, §7). Both are inert by
  # default: no DSN means the SDK never attempts delivery, and the sink resolves
  # to NullMetricPublisher unless it is switched on. They are named here rather
  # than left to the image because backend/.env is excluded from it — the same
  # omission that cost this profile its Lighthouse keys (README, decision 34).
  SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  CLOUDWATCH_METRICS_ENABLED: ${CLOUDWATCH_METRICS_ENABLED:-false}
  CLOUDWATCH_METRICS_NAMESPACE: ${CLOUDWATCH_METRICS_NAMESPACE:-AiLanguageCoach/Voice}
  CLOUDWATCH_METRICS_REGION: ${CLOUDWATCH_METRICS_REGION:-us-east-1}
  CLOUDWATCH_METRICS_ENVIRONMENT: ${CLOUDWATCH_METRICS_ENVIRONMENT:-local}
  VOICE_MONTHLY_MINUTES_BUDGET: ${VOICE_MONTHLY_MINUTES_BUDGET:-300}

  # Retention windows (plan §5, §7). The purge commands are scheduled, so a
  # container without these would silently fall back to the host defaults.
  PRIVACY_TRANSCRIPT_RETENTION_DAYS: ${PRIVACY_TRANSCRIPT_RETENTION_DAYS:-90}
  PRIVACY_ORPHAN_AUDIO_RETENTION_DAYS: ${PRIVACY_ORPHAN_AUDIO_RETENTION_DAYS:-7}

services:
  mysql:
    image: mysql:8.0
    container_name: coach_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-language_coach}
      MYSQL_USER: ${MYSQL_USER:-coach_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coach_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      # Loopback only — the database must not be reachable from the local network.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: coach_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # S3-compatible store for onboarding recordings (plan §5). The assessment
  # pipeline presigns POSTs and reads the object back, so a bucket has to exist
  # long before AWS does — and unlike the real bucket this one is reachable from
  # the host, which is what makes the whole pipeline testable locally.
  minio:
    image: quay.io/minio/minio:latest
    container_name: coach_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coach_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coach_minio_password}
    ports:
      # Loopback only, console included: the API is what Laravel signs against.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO starts empty, and the pipeline needs the bucket to exist before the
  # first presigned POST. Runs once, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: coach_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coach_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coach_minio_password}
      AWS_BUCKET: ${AWS_BUCKET:-coach-audio}
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_BUCKET" &&
        echo "bucket $$AWS_BUCKET ready"

  # LiveKit WebRTC server for real-time voice sessions (plan §5).
  # Handles room signaling, WebRTC media and webhook delivery to the backend.
  # rtc.node_ip is pinned to 127.0.0.1 so that ICE candidates announced to local
  # browsers match the host loopback instead of Docker's internal bridge IP.
  livekit:
    image: livekit/livekit-server:latest
    container_name: coach_livekit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    environment:
      <<: *livekit-credentials
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
      VOICE_WEBHOOK_URL: ${VOICE_WEBHOOK_URL:-http://host.docker.internal:8000/api/webhooks/livekit}
    entrypoint:
      - sh
      - -c
      - |
        cat << EOF > /tmp/livekit.yaml
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: "$$LIVEKIT_NODE_IP"
          use_external_ip: false
        keys:
          "$$LIVEKIT_API_KEY": "$$LIVEKIT_API_SECRET"
        webhook:
          api_key: "$$LIVEKIT_API_KEY"
          urls:
            - "$$VOICE_WEBHOOK_URL"
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Python Voice Agent worker (livekit-agents, Deepgram, LLM, TTS).
  # Registers under VOICE_AGENT_NAME ('ai-language-coach'), receives explicit dispatches
  # with lesson metadata from Laravel, joins the room as an AGENT participant,
  # conducts conversational practice with the learner, and reports failures.
  voice-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: coach_voice_agent
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      <<: *livekit-credentials
      LIVEKIT_URL: ws://livekit:7880
      VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-ai-language-coach}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://host.docker.internal:8000}
      VOICE_INTERNAL_SECRET: ${VOICE_INTERNAL_SECRET:-82cba8627ffb6407e152a3baa17f586b85f213cacb9b55b9}
      # Worker pool capacity (plan §5, §7). livekit-agents 1.8.5 does not read
      # these itself — agent.py passes them into WorkerOptions — and it has no
      # max_processes field at all: the concurrency ceiling is load_threshold
      # plus the container's CPU, measured by load/dispatch_capacity.py.
      NUM_IDLE_PROCESSES: ${NUM_IDLE_PROCESSES:-4}
      LOAD_THRESHOLD: ${LOAD_THRESHOLD:-0.7}
      DRAIN_TIMEOUT_SECONDS: ${DRAIN_TIMEOUT_SECONDS:-360}
      # Error tracking (plan §1, §7). Inert while the DSN is empty.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-${APP_ENV:-local}}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The worker's own HTTP server (livekit-agents, WorkerOptions.port). It
      # answers 200 "OK" once the worker is registered, which is the difference
      # between "the container is up" and "the fleet can actually take a job".
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8081/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Optional Full-Stack Profile (`docker compose --profile full up -d`)
  # ---------------------------------------------------------------------------
  api:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coach_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      <<: *laravel-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"

  horizon:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coach_horizon
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    # The backend image's own healthcheck probes port 8080 (`wget /up`), which a
    # queue worker never serves — the container was therefore reported unhealthy
    # while working perfectly. Horizon answers for itself instead.
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - api
    environment:
      # QUEUE_CONNECTION=redis comes from the anchor: Horizon is a Redis queue
      # runner and would sit idle against the `database` driver.
      <<: *laravel-environment

  reverb:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coach_reverb
    restart: unless-stopped
    # The image's role convention is Reverb on 8081 (README -> "Containers"),
    # and the `web` service below is told the same port, because the browser
    # reaches this container through the published host port rather than the
    # service name.
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    # Same inherited-healthcheck trap as `horizon`, with a second twist: Reverb
    # listens on 8081, and even there a plain GET / is a 404, so `wget` would
    # fail on the right port too. The probe is the socket, not a route.
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8081) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - api
    environment:
      <<: *laravel-environment

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coach_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      # frontend/.env is excluded from the image, so without these the built app
      # falls back to nuxt.config's port 8080 while the reverb container listens
      # on 8081 — every subscription would target a port nobody serves.
      NUXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      NUXT_PUBLIC_REVERB_HOST: 127.0.0.1
      NUXT_PUBLIC_REVERB_PORT: 8081
      NUXT_PUBLIC_REVERB_SCHEME: http
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  minio_data:
