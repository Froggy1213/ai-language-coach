services:
  mysql:
    image: mysql:8.0
    container_name: coach_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: language_coach
      MYSQL_USER: coach_user
      MYSQL_PASSWORD: coach_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: coach_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: