# Local development infrastructure.
#
# Only the stateful backing services run in Docker. Laravel and Nuxt run natively
# on the host (php artisan serve / npm run dev) so HMR, xdebug and artisan stay
# fast — see README.md -> "Local setup".
#
# Every value below can be overridden from `.env` in this directory (copy
# `.env.example` to `.env`); each one has a default, so `docker compose up -d`
# works without any .env at all.
#
# The compose project name is intentionally NOT set: it must stay derived from
# this directory, otherwise the existing `ai_language_coach_*` volumes (your
# current database) would be replaced by empty ones.

services:
  mysql:
    image: mysql:8.0
    container_name: coach_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-language_coach}
      MYSQL_USER: ${MYSQL_USER:-coach_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coach_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      # Loopback only — the database must not be reachable from the local network.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Credentials are read from the container's own environment, never inlined.
      # `mysqladmin ping` proves the server accepts connections, not just that the
      # port is open — matters because MySQL initialises for ~20s on first boot.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: coach_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # S3-compatible store for onboarding recordings (plan §5). The assessment
  # pipeline presigns POSTs and reads the object back, so a bucket has to exist
  # long before AWS does — and unlike the real bucket this one is reachable from
  # the host, which is what makes the whole pipeline testable locally.
  minio:
    image: quay.io/minio/minio:latest
    container_name: coach_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coach_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coach_minio_password}
    ports:
      # Loopback only, console included: the API is what Laravel signs against.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO starts empty, and the pipeline needs the bucket to exist before the
  # first presigned POST. Runs once, then exits.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: coach_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coach_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coach_minio_password}
      AWS_BUCKET: ${AWS_BUCKET:-coach-audio}
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_BUCKET" &&
        echo "bucket $$AWS_BUCKET ready"

volumes:
  mysql_data:
  redis_data:
  minio_data:

